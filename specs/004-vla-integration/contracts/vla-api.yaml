# API Contracts: VLA Integration Module

## Overview
This document defines the API contracts for the services that support the Vision-Language-Action (VLA) integration module. These APIs will support voice processing, LLM integration, perception systems, and the complete VLA pipeline for educational purposes.

## Base URL
`/api/v1`

## Authentication
All API endpoints require authentication via Bearer token in the Authorization header, except for public documentation content.

## Content Types
- Request: `application/json`
- Response: `application/json`

## Common Error Responses

### 400 Bad Request
```json
{
  "error": "Bad Request",
  "message": "Description of the error",
  "code": "INVALID_INPUT"
}
```

### 401 Unauthorized
```json
{
  "error": "Unauthorized",
  "message": "Authentication token is missing or invalid",
  "code": "AUTH_REQUIRED"
}
```

### 404 Not Found
```json
{
  "error": "Not Found",
  "message": "The requested resource does not exist",
  "code": "RESOURCE_NOT_FOUND"
}
```

### 500 Internal Server Error
```json
{
  "error": "Internal Server Error",
  "message": "An unexpected error occurred",
  "code": "INTERNAL_ERROR"
}
```

## Endpoints

### 1. Voice Processing

#### POST /vla/voice/process
Process voice command through Whisper and extract intent.

**Request Body:**
```json
{
  "audio_file_path": "string - Path to audio file",
  "audio_data": "string - Base64 encoded audio data (alternative to audio_file_path)",
  "language": "string - Optional language code (e.g., 'en', 'fr')",
  "processing_options": {
    "model_size": "string - tiny, base, small, medium, large (default: large)",
    "temperature": "number - Temperature for sampling (default: 0.0)"
  }
}
```

**Response:**
```json
{
  "command_id": "string",
  "transcription": "string - Transcribed text from audio",
  "confidence": "number - Confidence score of transcription",
  "extracted_intent": "string - Primary intent extracted from text",
  "intent_confidence": "number - Confidence score of intent extraction",
  "entities": {
    "object": "string - Object mentioned in command",
    "location": "string - Location mentioned in command",
    "action": "string - Action to perform",
    "other": ["string"] - Other relevant entities
  },
  "processing_time_ms": "number - Time taken for processing",
  "timestamp": "string - ISO 8601 timestamp"
}
```

**Status Codes:**
- 200: Success
- 400: Invalid request parameters
- 401: Authentication required
- 429: Rate limit exceeded (for API quotas)
- 500: Internal server error during processing

### 2. LLM Cognitive Planning

#### POST /vla/planning/generate-actions
Generate ROS 2 action sequence from natural language instruction using LLM.

**Request Body:**
```json
{
  "instruction": "string - Natural language task description",
  "context": {
    "environment": "string - Description of current environment",
    "robot_capabilities": ["string"] - List of robot capabilities,
    "previous_actions": ["string"] - Previous actions in current task (optional)
  },
  "options": {
    "model": "string - LLM model to use (default: gpt-4)",
    "max_tokens": "number - Maximum tokens to generate (default: 1000)",
    "temperature": "number - Creativity parameter (default: 0.3)"
  }
}
```

**Response:**
```json
{
  "plan_id": "string",
  "instruction": "string - Original instruction",
  "action_sequence": [
    {
      "step": "number - Step number in sequence",
      "action_type": "string - Type of action (navigate, pick, place, etc.)",
      "parameters": "object - Action-specific parameters",
      "preconditions": ["string"] - Conditions that must be true before execution,
      "expected_effects": ["string"] - Effects expected after execution,
      "timeout_seconds": "number - Timeout for this action"
    }
  ],
  "confidence_score": "number - Confidence in the plan",
  "estimated_execution_time": "number - Estimated time in seconds",
  "safety_rating": "string - Rating of potential safety concerns",
  "generated_by": "string - LLM model used",
  "processing_time_ms": "number - Time taken for generation",
  "timestamp": "string - ISO 8601 timestamp"
}
```

**Status Codes:**
- 200: Success
- 400: Invalid request parameters
- 401: Authentication required
- 429: Rate limit exceeded (for LLM API quotas)
- 500: Internal server error during planning

### 3. Perception Grounding

#### POST /vla/perception/ground-objects
Ground language-based commands to specific visual entities in the environment.

**Request Body:**
```json
{
  "image_data": "string - Base64 encoded image data",
  "image_file_path": "string - Path to image file (alternative to image_data)",
  "command": "string - Natural language command requiring grounding",
  "object_classes": ["string"] - Optional list of object classes to detect (default: all),
  "options": {
    "model": "string - Vision model to use (default: yolov8)",
    "confidence_threshold": "number - Minimum confidence for detections (default: 0.5)"
  }
}
```

**Response:**
```json
{
  "grounding_id": "string",
  "command": "string - Original command",
  "detected_objects": [
    {
      "object_id": "string",
      "class": "string - Object class (e.g., 'red ball', 'blue mug')",
      "confidence": "number - Detection confidence",
      "bbox": {
        "x": "number - Top-left x coordinate",
        "y": "number - Top-left y coordinate",
        "width": "number - Width of bounding box",
        "height": "number - Height of bounding box"
      },
      "world_coordinates": {
        "x": "number",
        "y": "number",
        "z": "number"
      },
      "is_target": "boolean - Whether this object is the target of the command",
      "spatial_relationships": ["string"] - Relationships to other objects
    }
  ],
  "target_entities": ["string"] - IDs of objects that match the command,
  "grounding_confidence": "number - Overall confidence in grounding",
  "processing_time_ms": "number - Time taken for processing",
  "timestamp": "string - ISO 8601 timestamp"
}
```

**Status Codes:**
- 200: Success
- 400: Invalid request parameters
- 401: Authentication required
- 500: Internal server error during perception processing

### 4. VLA Pipeline Execution

#### POST /vla/pipeline/execute
Execute a complete VLA pipeline from voice command to robot action.

**Request Body:**
```json
{
  "voice_command": {
    "audio_data": "string - Base64 encoded audio data",
    "transcription": "string - Pre-transcribed text (optional if audio_data provided)",
    "language": "string - Language code (optional)"
  },
  "context": {
    "environment": "string - Current environment description",
    "robot_capabilities": ["string"] - List of robot capabilities,
    "execution_mode": "string - 'simulation' or 'real' (default: 'simulation')"
  },
  "options": {
    "enable_perception": "boolean - Whether to use perception grounding (default: true)",
    "enable_verification": "boolean - Whether to verify action execution (default: true)"
  }
}
```

**Response:**
```json
{
  "execution_id": "string",
  "status": "string - 'processing', 'executing', 'completed', 'failed'",
  "pipeline_steps": [
    {
      "step": "string - Name of pipeline step",
      "status": "string - 'pending', 'processing', 'completed', 'failed'",
      "result": "object - Result of the step",
      "timestamp": "string - ISO 8601 timestamp"
    }
  ],
  "final_result": {
    "success": "boolean - Whether the overall execution was successful",
    "message": "string - Human-readable result message",
    "action_log": ["string"] - Log of actions taken,
    "execution_time_ms": "number - Total execution time"
  },
  "progress": "number - Percentage complete (0-100)",
  "estimated_completion": "string - Estimated completion time in ISO 8601 format",
  "timestamp": "string - ISO 8601 timestamp"
}
```

**Status Codes:**
- 202: Accepted for processing (execution may be ongoing)
- 400: Invalid request parameters
- 401: Authentication required
- 500: Internal server error during pipeline execution

#### GET /vla/pipeline/status/{execution_id}
Get the status of a VLA pipeline execution.

**Path Parameters:**
- `execution_id`: string - The ID of the pipeline execution to retrieve status for

**Response:**
```json
{
  "execution_id": "string",
  "status": "string - 'processing', 'executing', 'completed', 'failed', 'cancelled'",
  "pipeline_steps": [
    {
      "step": "string - Name of pipeline step",
      "status": "string - 'pending', 'processing', 'completed', 'failed'",
      "result": "object - Result of the step",
      "timestamp": "string - ISO 8601 timestamp"
    }
  ],
  "current_step": "string - Name of the currently executing step",
  "progress": "number - Percentage complete (0-100)",
  "estimated_completion": "string - Estimated completion time in ISO 8601 format",
  "final_result": {
    "success": "boolean - Whether the overall execution was successful",
    "message": "string - Human-readable result message",
    "action_log": ["string"] - Log of actions taken
  },
  "timestamp": "string - ISO 8601 timestamp"
}
```

**Status Codes:**
- 200: Success
- 401: Authentication required
- 404: Execution not found
- 500: Internal server error during status retrieval

### 5. RAG Content Integration

#### GET /docs/vla-content
Retrieve structured content for RAG indexing specific to the VLA module.

**Query Parameters:**
- `format`: string (optional, default: 'json') - Output format ('json' or 'text')
- `include_examples`: boolean (optional, default: true) - Whether to include code/configuration examples

**Response:**
```json
{
  "module": "04-vla-integration",
  "content": [
    {
      "id": "string - Unique content ID",
      "title": "string - Content title",
      "url": "string - Relative URL in documentation",
      "content": "string - Content text for indexing",
      "chapter": "string - Chapter identifier",
      "section": "string - Section within chapter",
      "headers": [
        {
          "level": "number - Header level (1-6)",
          "text": "string - Header text",
          "id": "string - Anchor ID"
        }
      ],
      "metadata": {
        "module": "string",
        "chapter": "string",
        "tags": ["string"]
      }
    }
  ],
  "total_count": "number",
  "last_updated": "string - ISO 8601 timestamp"
}
```

**Status Codes:**
- 200: Content retrieved successfully
- 400: Invalid parameters
- 401: Authentication required
- 500: Internal server error during content retrieval

## Data Models

### Voice Command Processing
- command_id: string (UUID)
- transcription: string
- confidence: number
- extracted_intent: string
- intent_confidence: number
- entities: map of string to string/array
- processing_time_ms: number
- timestamp: string

### Action Sequence
- sequence_id: string (UUID)
- instruction: string
- action_sequence: list of ActionStep
- confidence_score: number
- estimated_execution_time: number
- safety_rating: string
- generated_by: string
- processing_time_ms: number
- timestamp: string

### Action Step
- step: number
- action_type: string
- parameters: object
- preconditions: list of string
- expected_effects: list of string
- timeout_seconds: number

### Detected Object
- object_id: string (UUID)
- class: string
- confidence: number
- bbox: BoundingBox object
- world_coordinates: Vector3 object
- is_target: boolean
- spatial_relationships: list of string

### Bounding Box
- x: number
- y: number
- width: number
- height: number

### Vector3
- x: number
- y: number
- z: number

### Pipeline Execution
- execution_id: string (UUID)
- status: string
- pipeline_steps: list of StepStatus
- final_result: ExecutionResult object
- progress: number
- estimated_completion: string
- timestamp: string

### Step Status
- step: string
- status: string
- result: object
- timestamp: string

### Execution Result
- success: boolean
- message: string
- action_log: list of string
- execution_time_ms: number