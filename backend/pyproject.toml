[project]
name = "physical-ai-rag-pipeline"
version = "0.1.0"
description = "RAG content ingestion pipeline for Physical AI & Humanoid Robotics book"
requires-python = ">=3.11"
authors = [{name = "GIAIC Developer", email = "developer@giaic.com"}]

dependencies = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "cohere>=5.0.0",
    "qdrant-client>=1.7.0",
    "tiktoken>=0.5.0",
    "python-dotenv>=1.0.0",
    "lxml>=6.0.2",
    "openai-agents>=0.0.7",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
